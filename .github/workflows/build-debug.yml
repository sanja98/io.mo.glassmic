name: Build GlassMic debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "core/**"
      - "xposed/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradlew"
      - ".github/workflows/build-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and native tools
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassMic-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
